<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Factory Data Hub | Control Room</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- External CSS -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <h1><i class="fa-solid fa-industry"></i> <span data-i18n="title">Factory Control Center</span></h1>
        <div style="display: flex; align-items: center; gap: 20px;">
            <div style="color: var(--text-muted);">
                <span data-i18n="liveStatus">Live Status:</span> 
                <span id="connectionStatus" style="color: var(--success);">
                    <i class="fa-solid fa-circle-dot fa-fade"></i> <span data-i18n="connected">Connected</span>
                </span>
            </div>
            <button class="btn btn-icon" onclick="toggleLanguage()" id="langToggleBtn" title="Toggle TH/EN" style="font-weight: bold; font-size: 0.9rem;">
                TH
            </button>
            <button class="btn btn-icon" onclick="toggleTheme()" id="themeToggleBtn" title="Toggle Light/Dark Mode">
                <i class="fa-solid fa-sun"></i>
            </button>
        </div>
    </header>

    <div class="container">
        <!-- Left Column: Live Data -->
        <div class="glass-panel">
            <h2><i class="fa-solid fa-server"></i> <span data-i18n="liveData">Live Machine Data</span></h2>
            <p style="color: var(--text-muted); font-size: 0.9rem;" data-i18n="feedDesc">Real-time feed from 20 factory machines</p>
            <table>
                <thead>
                    <tr>
                        <th data-i18n="colMachine">Machine ID</th>
                        <th data-i18n="colTemp">Temperature (°C)</th>
                        <th data-i18n="colStatus">Status</th>
                        <th data-i18n="colAction">Action</th>
                    </tr>
                </thead>
                <tbody id="machineTableBody">
                    <tr>
                        <td colspan="4" style="text-align:center;" data-i18n="loading">Loading data...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Right Column: Tickets -->
        <div class="glass-panel">
            <h2><i class="fa-solid fa-screwdriver-wrench"></i> <span data-i18n="activeTickets">Active Repair Tickets</span></h2>
            <button class="btn btn-primary" onclick="openModal('')" style="width: 100%; margin-bottom: 1rem;">
                <i class="fa-solid fa-plus"></i> <span data-i18n="createTicket">Create Manual Ticket</span>
            </button>
            <div id="ticketsContainer">
                <p style="text-align:center; color: var(--text-muted);" data-i18n="loading">Loading tickets...</p>
            </div>
        </div>
    </div>

    <!-- Repair Request Modal -->
    <div id="repairModal" class="modal">
        <div class="modal-content">
            <h2 style="margin-top: 0; color: var(--danger);"><i class="fa-solid fa-triangle-exclamation"></i> <span data-i18n="reportIssue">Report Issue</span></h2>
            <div class="form-group">
                <label data-i18n="lblMachine">Machine ID</label>
                <input type="text" id="reqMachineId" placeholder="e.g. M-05">
            </div>
            <div class="form-group">
                <label data-i18n="lblOperator">Operator Name</label>
                <input type="text" id="reqOperator" placeholder="Your Name">
            </div>
            <div class="form-group">
                <label data-i18n="lblPriority">Priority</label>
                <select id="reqPriority">
                    <option value="Low" data-i18n="prioLow">Low (No rush)</option>
                    <option value="Normal" selected data-i18n="prioNormal">Normal (Standard check)</option>
                    <option value="High" data-i18n="prioHigh">High (Needs attention soon)</option>
                    <option value="Urgent" data-i18n="prioUrgent">Urgent (Machine stopped!)</option>
                </select>
            </div>
            <div class="form-group">
                <label data-i18n="lblDesc">Issue Description</label>
                <textarea id="reqDescription" rows="3" placeholder="..."></textarea>
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 10px;">
                <button class="btn"
                    style="background: transparent; color: var(--text-main); border: 1px solid var(--text-muted);"
                    onclick="closeModal()" data-i18n="btnCancel">Cancel</button>
                <button class="btn btn-primary" onclick="submitTicket()" data-i18n="btnSubmit">Submit Ticket</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5209/api';

        // --- Translation Dictionary ---
        const i18n = {
            en: {
                title: "Factory Control Center",
                liveStatus: "Live Status:",
                connected: "Connected",
                disconnected: "Disconnected",
                liveData: "Live Machine Data",
                feedDesc: "Real-time feed from 20 factory machines",
                colMachine: "Machine ID",
                colTemp: "Temperature (°C)",
                colStatus: "Status",
                colAction: "Action",
                loading: "Loading data...",
                activeTickets: "Active Repair Tickets",
                createTicket: "Create Manual Ticket",
                noTickets: "No active tickets. All good!",
                reportIssue: "Report Issue",
                lblMachine: "Machine ID",
                lblOperator: "Operator Name",
                lblPriority: "Priority",
                lblDesc: "Issue Description",
                btnCancel: "Cancel",
                btnSubmit: "Submit Ticket",
                prioLow: "Low (No rush)",
                prioNormal: "Normal (Standard check)",
                prioHigh: "High (Needs attention soon)",
                prioUrgent: "Urgent (Machine stopped!)",
                btnReport: "Report"
            },
            th: {
                title: "ศูนย์ควบคุมโรงงาน",
                liveStatus: "สถานะระบบ:",
                connected: "เชื่อมต่อแล้ว",
                disconnected: "ขาดการเชื่อมต่อ",
                liveData: "ข้อมูลเครื่องจักรแบบเรียลไทม์",
                feedDesc: "ข้อมูลส่งตรงจากเครื่องจักร 20 เครื่อง",
                colMachine: "รหัสเครื่องจักร",
                colTemp: "อุณหภูมิ (°C)",
                colStatus: "สถานะ",
                colAction: "จัดการ",
                loading: "กำลังโหลดข้อมูล...",
                activeTickets: "รายการแจ้งซ่อมที่กำลังดำเนินการ",
                createTicket: "สร้างใบแจ้งซ่อม",
                noTickets: "ไม่มีรายการแจ้งซ่อม ทุกอย่างปกติดี!",
                reportIssue: "แจ้งปัญหา / แจ้งซ่อม",
                lblMachine: "รหัสเครื่องจักร",
                lblOperator: "ชื่อผู้แจ้ง",
                lblPriority: "ระดับความด่วน",
                lblDesc: "รายละเอียดปัญหา",
                btnCancel: "ยกเลิก",
                btnSubmit: "ส่งใบแจ้งซ่อม",
                prioLow: "ต่ำ (ไม่รีบ)",
                prioNormal: "ปานกลาง (ตรวจเช็คทั่วไป)",
                prioHigh: "สูง (ต้องรีบแก้ไข)",
                prioUrgent: "ด่วนมาก (เครื่องหยุดทำงาน!)",
                btnReport: "แจ้งซ่อม"
            }
        };

        let currentLang = localStorage.getItem('lang') || 'en';

        function applyLanguage() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18n[currentLang][key]) {
                    el.innerText = i18n[currentLang][key];
                }
            });
            document.getElementById('langToggleBtn').innerText = currentLang === 'en' ? 'TH' : 'EN';
        }

        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'th' : 'en';
            localStorage.setItem('lang', currentLang);
            applyLanguage();
            // Refresh tables to apply translations to dynamic buttons
            fetchMachineData();
            fetchTickets();
        }

        // --- Theme Toggle Logic ---
        function toggleTheme() {
            const html = document.documentElement;
            const btn = document.getElementById('themeToggleBtn');
            const isDark = html.getAttribute('data-theme') === 'dark';

            if (isDark) {
                html.removeAttribute('data-theme'); // Light mode
                btn.innerHTML = '<i class="fa-solid fa-moon"></i>';
                localStorage.setItem('theme', 'light');
            } else {
                html.setAttribute('data-theme', 'dark'); // Dark mode
                btn.innerHTML = '<i class="fa-solid fa-sun"></i>';
                localStorage.setItem('theme', 'dark');
            }
        }

        // Initialize Theme & Lang
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light') {
            document.documentElement.removeAttribute('data-theme');
            document.getElementById('themeToggleBtn').innerHTML = '<i class="fa-solid fa-moon"></i>';
        }
        applyLanguage();

        // --- Connection Status Logic ---
        function updateConnectionStatus(isConnected) {
            const statusEl = document.getElementById('connectionStatus');
            if (isConnected) {
                statusEl.style.color = 'var(--success)';
                statusEl.innerHTML = `<i class="fa-solid fa-circle-dot fa-fade"></i> <span data-i18n="connected">${i18n[currentLang].connected}</span>`;
            } else {
                statusEl.style.color = 'var(--danger)';
                statusEl.innerHTML = `<i class="fa-solid fa-triangle-exclamation fa-fade"></i> <span data-i18n="disconnected">${i18n[currentLang].disconnected}</span>`;
            }
        }

        // --- Fetch Live Machine Data ---
        async function fetchMachineData() {
            try {
                const res = await fetch(`${API_BASE}/machinedata`);
                const data = await res.json();

                updateConnectionStatus(true); // Connected Successfully

                const tbody = document.getElementById('machineTableBody');
                tbody.innerHTML = '';

                const latestMap = new Map();
                data.forEach(item => {
                    if (!latestMap.has(item.machineId)) {
                        latestMap.set(item.machineId, item);
                    }
                });

                const sortedMachines = Array.from(latestMap.values()).sort((a, b) => a.machineId.localeCompare(b.machineId));

                sortedMachines.forEach(m => {
                    let btnHtml = '';
                    if (m.status === 'Error' || m.status === 'Warning') {
                        btnHtml = `<button class="btn" onclick="openModal('${m.machineId}', '${m.status === 'Error' ? 'Urgent' : 'High'}')"><i class="fa-solid fa-wrench"></i> ${i18n[currentLang].btnReport}</button>`;
                    }

                    tbody.innerHTML += `
                        <tr>
                            <td style="font-weight: 600;">${m.machineId}</td>
                            <td style="font-size: 1.1rem;">${m.temperature.toFixed(2)}</td>
                            <td class="status-${m.status}"><strong><i class="fa-solid ${m.status === 'Error' ? 'fa-triangle-exclamation' : 'fa-circle-check'}"></i> ${m.status}</strong></td>
                            <td>${btnHtml}</td>
                        </tr>
                    `;
                });
            } catch (err) {
                console.error("API Connection Error:", err);
                updateConnectionStatus(false); // Connection Failed
            }
        }

        // --- Fetch Tickets ---
        async function fetchTickets() {
            try {
                const res = await fetch(`${API_BASE}/maintenancerequests`);
                const data = await res.json();

                const container = document.getElementById('ticketsContainer');
                container.innerHTML = '';

                if (data.length === 0) {
                    container.innerHTML = `<p style="text-align:center; color: var(--text-muted);">${i18n[currentLang].noTickets}</p>`;
                    return;
                }

                data.forEach(t => {
                    const time = new Date(t.reportedAt).toLocaleTimeString();
                    const priority = t.priority || 'Normal'; // Fallback if null

                    container.innerHTML += `
                        <div class="ticket ${t.isResolved ? 'resolved' : ''}">
                            <div style="display:flex; justify-content:space-between; align-items: center;">
                                <strong>${t.machineId}</strong>
                                <span class="badge badge-${priority}">${priority}</span>
                            </div>
                            <div style="margin: 8px 0; font-size: 0.9rem;">${t.issueDescription}</div>
                            <div style="display:flex; justify-content:space-between; align-items: center; font-size: 0.8rem; color: var(--text-muted);">
                                <span><i class="fa-regular fa-user"></i> ${t.reportedBy}</span>
                                <span><i class="fa-regular fa-clock"></i> ${time}</span>
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                console.error(err);
            }
        }

        // --- Modal Logic ---
        function openModal(machineId, defaultPriority = 'Normal') {
            document.getElementById('reqMachineId').value = machineId;
            document.getElementById('reqPriority').value = defaultPriority;
            document.getElementById('repairModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('repairModal').style.display = 'none';
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('repairModal');
            if (event.target === modal) {
                closeModal();
            }
        }

        // --- Submit Ticket ---
        async function submitTicket() {
            const mId = document.getElementById('reqMachineId').value;
            const op = document.getElementById('reqOperator').value;
            const desc = document.getElementById('reqDescription').value;
            const prio = document.getElementById('reqPriority').value; // Get Priority

            if (!mId || !op || !desc) {
                alert(currentLang === 'th' ? "กรุณากรอกข้อมูลให้ครบถ้วน" : "Please fill all fields");
                return;
            }

            const payload = {
                MachineId: mId,
                ReportedBy: op,
                IssueDescription: desc,
                Priority: prio // Send Priority to C# API
            };

            await fetch(`${API_BASE}/maintenancerequests`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            closeModal();
            fetchTickets();
        }

        // Initialize and poll
        fetchMachineData();
        fetchTickets();
        setInterval(fetchMachineData, 3000);
        setInterval(fetchTickets, 5000);

    </script>
</body>

</html>
